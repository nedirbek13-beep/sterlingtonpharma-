<form class="form" id="contact-form" action="/api/contact" method="post" novalidate data-contact-form>
  <div class="form-grid">
    <div class="fld fld--full">
      <label class="fld-label" for="cf-type">{{t.form.type}} <span class="req" aria-hidden="true">*</span></label>
      <select class="fld-input" id="cf-type" name="type" required>
        <option value="">{{t.form.typePlaceholder}}</option>
        <option value="distribution">{{t.form.types.distribution}}</option>
        <option value="hospital">{{t.form.types.hospital}}</option>
        <option value="tender">{{t.form.types.tender}}</option>
        <option value="quotation">{{t.form.types.quotation}}</option>
        <option value="documentation">{{t.form.types.documentation}}</option>
        <option value="other">{{t.form.types.other}}</option>
      </select>
    </div>
    <div class="fld"><label class="fld-label" for="cf-name">{{t.form.name}} <span class="req" aria-hidden="true">*</span></label><input class="fld-input" id="cf-name" name="name" type="text" autocomplete="name" required></div>
    <div class="fld"><label class="fld-label" for="cf-org">{{t.form.organisation}} <span class="req" aria-hidden="true">*</span></label><input class="fld-input" id="cf-org" name="organisation" type="text" autocomplete="organization" required></div>
    <div class="fld"><label class="fld-label" for="cf-email">{{t.form.email}} <span class="req" aria-hidden="true">*</span></label><input class="fld-input" id="cf-email" name="email" type="email" autocomplete="email" inputmode="email" required></div>
    <div class="fld"><label class="fld-label" for="cf-phone">{{t.form.phone}} <span class="opt">{{t.form.optional}}</span></label><input class="fld-input" id="cf-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel"></div>
    <div class="fld"><label class="fld-label" for="cf-country">{{t.form.country}} <span class="req" aria-hidden="true">*</span></label><input class="fld-input" id="cf-country" name="country" type="text" autocomplete="country-name" required></div>
    <div class="fld"><label class="fld-label" for="cf-product">{{t.form.product}} <span class="opt">{{t.form.optional}}</span></label><select class="fld-input" id="cf-product" name="product"><option value="">{{t.form.productAny}}</option>{{{productOptions}}}</select></div>
    <div class="fld fld--full"><label class="fld-label" for="cf-msg">{{t.form.message}} <span class="req" aria-hidden="true">*</span></label><textarea class="fld-input" id="cf-msg" name="message" rows="5" minlength="20" required></textarea><p class="fld-hint" id="cf-msg-hint">{{t.form.messageHint}}</p></div>
    <div class="fld fld--full fld--check">
      <input class="fld-check" id="cf-consent" name="consent" type="checkbox" value="yes" required>
      <label for="cf-consent">{{{t.form.consent}}} <span class="req" aria-hidden="true">*</span></label>
    </div>
    <div class="hp" aria-hidden="true"><label for="cf-website">Website</label><input id="cf-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
    <input type="hidden" name="started" value="" data-started>
    <input type="hidden" name="lang" value="{{lang}}">
  </div>
  <div class="form-actions">
    <button class="btn btn--primary btn--lg" type="submit" data-submit><span class="btn-label">{{t.form.send}}</span><span class="btn-spinner" aria-hidden="true"></span></button>
    <p class="form-note">{{{t.form.note}}}</p>
  </div>
  <div class="form-status" role="status" aria-live="polite" data-status></div>
</form>
