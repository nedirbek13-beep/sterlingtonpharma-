<form class="form" id="contact-form" action="/api/contact" method="post" novalidate data-contact-form>
  <div class="form-grid">
    <div class="fld fld--full">
      <label class="fld-label" for="cf-type">Enquiry type <span class="req" aria-hidden="true">*</span></label>
      <select class="fld-input" id="cf-type" name="type" required>
        <option value="">Select the nature of your enquiry</option>
        <option value="distribution">Distribution partnership</option>
        <option value="hospital">Hospital or institutional supply</option>
        <option value="tender">Tender or public procurement</option>
        <option value="quotation">Product quotation</option>
        <option value="documentation">Product documentation (CoA, GMP certificate, batch records)</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="fld"><label class="fld-label" for="cf-name">Full name <span class="req" aria-hidden="true">*</span></label><input class="fld-input" id="cf-name" name="name" type="text" autocomplete="name" required></div>
    <div class="fld"><label class="fld-label" for="cf-org">Organisation <span class="req" aria-hidden="true">*</span></label><input class="fld-input" id="cf-org" name="organisation" type="text" autocomplete="organization" required></div>
    <div class="fld"><label class="fld-label" for="cf-email">Work email <span class="req" aria-hidden="true">*</span></label><input class="fld-input" id="cf-email" name="email" type="email" autocomplete="email" inputmode="email" required></div>
    <div class="fld"><label class="fld-label" for="cf-phone">Phone <span class="opt">(optional)</span></label><input class="fld-input" id="cf-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel"></div>
    <div class="fld"><label class="fld-label" for="cf-country">Country <span class="req" aria-hidden="true">*</span></label><input class="fld-input" id="cf-country" name="country" type="text" autocomplete="country-name" required></div>
    <div class="fld"><label class="fld-label" for="cf-product">Product of interest <span class="opt">(optional)</span></label><select class="fld-input" id="cf-product" name="product"><option value="">Any / not sure yet</option>{{{productOptions}}}</select></div>
    <div class="fld fld--full"><label class="fld-label" for="cf-msg">Message <span class="req" aria-hidden="true">*</span></label><textarea class="fld-input" id="cf-msg" name="message" rows="5" minlength="20" required></textarea><p class="fld-hint" id="cf-msg-hint">Include the products, quantities and destination market you have in mind, if known.</p></div>
    <div class="fld fld--full fld--check">
      <input class="fld-check" id="cf-consent" name="consent" type="checkbox" value="yes" required>
      <label for="cf-consent">I agree that Sterlington may store and use these details to respond to my enquiry, as described in the <a href="/privacy">privacy policy</a>. <span class="req" aria-hidden="true">*</span></label>
    </div>
    <div class="hp" aria-hidden="true"><label for="cf-website">Website</label><input id="cf-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
    <input type="hidden" name="started" value="" data-started>
  </div>
  <div class="form-actions">
    <button class="btn btn--primary btn--lg" type="submit" data-submit><span class="btn-label">Send enquiry</span><span class="btn-spinner" aria-hidden="true"></span></button>
    <p class="form-note">Required fields are marked with <span class="req">*</span>. We aim to respond within one business day.</p>
  </div>
  <div class="form-status" role="status" aria-live="polite" data-status></div>
</form>
