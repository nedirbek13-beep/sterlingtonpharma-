<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#ffffff">
<script>document.documentElement.classList.add('js')</script>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sterlington Pharma">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Sterlington Pharma — sterile injectable and oral medicines">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/fonts/source-serif-4-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/source-serif-4-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/inter-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.min.css">
{{{extraHead}}}
{{{jsonLd}}}
</head>
<body class="{{bodyClass}}" data-header-theme="{{headerTheme}}">
<a class="skip-link" href="#main">Skip to content</a>
{{> header}}
<main id="main" tabindex="-1">
{{{content}}}
</main>
{{> footer}}
<script src="/assets/js/site.js" defer></script>
{{{extraScripts}}}
</body>
</html>
